<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mini project password generator">
    <meta name="keywords" content="Password, Generator, Security, Tool">
    <meta property="og:description" content="Mini project password generator">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.png" sizes="16x16" type="image/png">
    <script src="script.js" defer></script>
    <title>Password Generator</title>
</head>

<body>
    <main class="container">
        <div class="card">

            <header>
                <span class="eyebrow">SECURITY TOOL</span>
                <h1>Password generator</h1>
                <p>Create a strong and secure password in seconds.</p>
            </header>

            <section class="generator" aria-label="Generated password">
                <div class="password-wrapper">
                    <input
                        type="text"
                        name="passGenerate"
                        id="passGenerate"
                        placeholder="Your password"
                        readonly
                    >
                    <span id="copyTooltip" role="tooltip"></span>
                </div>

                <button type="button" id="generateBtn">
                    Generate
                </button>
            </section>

            <section class="strength">
                <div class="strength-header">
                    <span>Password length</span>
                    <span id="passStrength">12</span>
                </div>

                <input
                    type="range"
                    min="1"
                    max="50"
                    value="12"
                    class="slider"
                    name="passRange"
                    id="passRange"
                >
            </section>

            <section class="options">
                <div class="options-header">
                    <span>Password options</span>
                </div>

                <div class="options-grid">
                    <label for="uppercase" class="option">
                        <input
                            type="checkbox"
                            name="uppercase"
                            id="uppercase"
                            checked
                        >
                        <span>Uppercase</span>
                    </label>

                    <label for="lowercase" class="option">
                        <input
                            type="checkbox"
                            name="lowercase"
                            id="lowercase"
                            checked
                        >
                        <span>Lowercase</span>
                    </label>

                    <label for="numbers" class="option">
                        <input
                            type="checkbox"
                            name="numbers"
                            id="numbers"
                        >
                        <span>Numbers</span>
                    </label>

                    <label for="symbols" class="option">
                        <input
                            type="checkbox"
                            name="symbols"
                            id="symbols"
                        >
                        <span>Symbols</span>
                    </label>
                </div>
            </section>

        </div>
    </main>
</body>
</html>
